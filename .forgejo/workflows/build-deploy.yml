# Generated by VCS — do not hand-edit; re-provisioning overwrites this file.
# Builds and pushes the project's image. Releases run only through the VCS API.
name: build
on:
  push: {}
  workflow_dispatch: {}

jobs:
  build:
    runs-on: default
    steps:
      - uses: actions/checkout@v6

      - name: Refuse emulated Dockerfile stages
        run: |
          cat > /tmp/vcs-dockerfile-lint.awk <<'VCS_LINT'
          # Refuses Dockerfiles that would run commands on the linux/amd64 target platform.
          # The Forgejo builder is ARM64 and QEMU emulation is not allowed: every stage that
          # uses RUN must start FROM --platform=$BUILDPLATFORM, and the final stage may only
          # COPY the produced artifacts.
          function trim(s) { sub(/^[ \t]+/, "", s); sub(/[ \t]+$/, "", s); return s }
          function handle(text, no,    n, parts, i, instr, native, image, asname, hasplat) {
            n = split(trim(text), parts, /[ \t]+/)
            instr = toupper(parts[1])
            if (instr == "FROM") {
              native = 0; image = ""; asname = ""; hasplat = 0
              for (i = 2; i <= n; i++) {
                if (parts[i] ~ /^--platform=/) {
                  hasplat = 1
                  native = (parts[i] ~ /BUILDPLATFORM|linux\/arm64/) ? 1 : 0
                } else if (parts[i] ~ /^--/) {
                  continue
                } else if (image == "") {
                  image = parts[i]
                } else if (toupper(parts[i]) == "AS") {
                  asname = parts[i + 1]
                  break
                }
              }
              if (!hasplat) {
                if (tolower(image) in stageNative) native = stageNative[tolower(image)]
                else if (tolower(image) == "scratch") native = 1
              }
              stageNative[stages] = native
              if (asname != "") stageNative[tolower(asname)] = native
              stages++
              cur = native; curimage = image
            } else if (instr == "RUN" && !cur) {
              printf "Dockerfile line %d: RUN executes on the linux/amd64 target platform (stage FROM %s), which would need QEMU emulation on the ARM64 builder. Use FROM --platform=$BUILDPLATFORM for stages that run commands and only COPY the results into the final stage.\n", no, curimage > "/dev/stderr"
              bad = 1
            }
          }
          BEGIN { cur = 1; stages = 0; bad = 0 }
          {
            line = $0
            sub(/\r$/, "", line)
            stripped = trim(line)
            if (!cont) { acc = ""; start = NR }
            if (stripped == "" || substr(stripped, 1, 1) == "#") next
            if (stripped ~ /\\$/) { sub(/\\$/, "", stripped); acc = acc " " stripped; cont = 1; next }
            acc = acc " " stripped; cont = 0
            handle(acc, start)
          }
          END { exit bad }
          VCS_LINT
          if [ -f Dockerfile ]; then awk -f /tmp/vcs-dockerfile-lint.awk Dockerfile; fi

      # The docker driver builds on the host daemon: its layer and BuildKit caches
      # persist between runs and no builder container is left behind (the default
      # docker-container driver starts a cold builder per run and leaks it).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: git-vcs.ibbr.info
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: git-vcs.ibbr.info/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # The docker driver also keeps a copy of the pushed image on the runner host. The
      # registry is the canonical store, so drop the local copy; the build cache stays.
      - name: Remove local image copy
        if: always()
        run: docker image rm git-vcs.ibbr.info/${{ github.repository }}:${{ github.sha }} || true
